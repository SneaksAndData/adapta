name: Run unit tests

on:
  pull_request:
    branches: [ main ]

jobs:
  validate_code:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Don't cancel other versions if one fails
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    permissions:
      id-token: write      # required for dependabot PRs
      pull-requests: write # required for dependabot PRs
      contents: read       # required for dependabot PRs

    if: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install

      - name: Prepare environment
        run: uv sync --frozen --all-extras

      - name: Build the Docker Compose stack
        run: docker compose up --quiet-pull -d

      - name: Get Compose Logs
        if: always()
        run: docker compose logs

      - name: Run Tests
        run:  |
          set -euo pipefail
          
          sleep 10 # let Trino boot
          
          uv run pytest | tee pytest-coverage.txt

      - name: Publish Code Coverage
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          pytest-coverage-path: ./pytest-coverage.txt

  validate_commit:
    name: Validate commit
    runs-on: ubuntu-latest
    needs: [validate_code]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          RESULT: ${{ needs.validate_code.result }}
        run: |
          echo "Result: $RESULT"
          [ "$RESULT" = "success" ]
